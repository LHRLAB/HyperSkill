[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperskill"
version = "1.0.0"
description = "HyperSkill: Training-Free Omnimodal GRPO via Hypergraph-Indexed Skill-Library Evolution"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "networkx>=3.0",
    "numpy>=1.26.0",
    "PyMuPDF>=1.24.3",
    "opencv-python-headless>=4.8",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.2.3"]

[tool.setuptools.packages.find]
include = ["hyperskill*"]

[tool.setuptools.package-data]
hyperskill = ["configs/*.yaml"]
