# HyperSkill — Text modality config
# Datasets: AIME2024, AIME2025, WebWalkerQA
# Override any field here; _cfg_from_dataset() merges these on top of defaults.

llm:
  base_url: https://api.apiyi.com/v1
  model: gemini-3.1-flash-lite-preview
  embedding_model: gemini-embedding-2-preview
  embedding_dim: 3072
  max_tokens: 2048
  temperature: 0.7
  max_retries: 3
  timeout: 60.0

hypergraph:
  top_k: 1                     # only the single most relevant skill
  test_top_k: 2                # inject top 2 high-advantage skills for text/math
  test_min_similarity: 0.6     # strict: only fire on highly relevant skills
  test_min_advantage: 0.0      # text/math: skills are reliable, keep all positive-advantage
  skill_dedup_threshold: 1.0
  eta: 0.15
  beta: 0.01
  eps: 0.2
  prune_interval: 1000
  prune_min_advantage: -0.2

rollout:
  n: 4
  max_gen_round: 3
  max_prompt_length: 4096
  max_new_tokens: 1024
  image_search_limit: 0
  text_search_limit: 2
  max_search_tokens: 800
