# HyperSkill — Text modality config
# Datasets: AIME2024, AIME2025, WebWalkerQA
# runner._build_cfg() loads these on top of the config.py dataclass defaults;
# in eval mode runner._EVAL_RETRIEVAL then overrides the test_* fields.

llm:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.1-flash-lite-preview
  embedding_model: google/gemini-embedding-2-preview
  embedding_dim: 3072
  max_tokens: 2048
  temperature: 0.7
  max_retries: 3
  timeout: 60.0

hypergraph:
  top_k: 1                     # only the single most relevant skill
  test_min_similarity: 0.6     # training-time retrieval floor (eval overrides to 0.0)
  skill_dedup_threshold: 1.0
  eta: 0.15
  beta: 0.01
  eps: 0.2
  prune_interval: 1000
  prune_min_advantage: -0.2

rollout:
  n: 4
  max_gen_round: 3
  max_prompt_length: 4096
  max_new_tokens: 1024
  text_search_limit: 2
