# HyperSkill — Omni modality config (audio + video + text + image)
# Datasets: OmniVideoBench, WorldSense
# Override any field here; _cfg_from_dataset() merges these on top of defaults.

llm:
  base_url: https://api.apiyi.com/v1
  model: gemini-3.1-flash-lite-preview
  embedding_model: gemini-embedding-2-preview
  embedding_dim: 3072
  max_tokens: 2048
  temperature: 1.0       # bumped from 0.7 — diversify rollouts so GRPO has variance
  max_retries: 3
  timeout: 120.0

hypergraph:
  top_k: 10
  skill_dedup_threshold: 1.0
  eta: 0.1
  beta: 0.01
  eps: 0.2
  prune_interval: 500
  prune_min_advantage: -0.5

rollout:
  n: 4                   # bumped from 2 — more rollouts → more variance for skill extraction
  max_gen_round: 8
  max_prompt_length: 8096
  max_new_tokens: 1024
  image_search_limit: 2
  text_search_limit: 2
  max_search_tokens: 1200
