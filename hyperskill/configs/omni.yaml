# HyperSkill — Omni modality config (audio + video + text + image)
# Datasets: OmniVideoBench, WorldSense
# Merge order (hyperskill/config.py, load_config):
#   --train: shared sections -> library_runs[<library_run>] -> configs entry "train"
#   --eval:  shared sections -> eval -> configs entry "eval"
#   then datasets.<dataset>.harness (both modes)
# The per-dataset entries ("library_run", "train", "eval", seed) are in
# configs/final_configs.json.

llm:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-2.5-flash-lite
  embedding_model: google/gemini-embedding-2-preview
  embedding_dim: 3072
  max_retries: 3
  timeout: 120.0

hypergraph:
  top_k: 3                    # N_max
  skill_dedup_threshold: 1.0
  eta: 0.1
  prune_interval: 500
  prune_min_advantage: -0.5   # q_min
  cf_k: 2                     # K counterfactual probes, strict majority
  rho: 0.5                    # success / failure split
  rrf_k: 60                   # k_rrf

rollout:
  n: 2                        # rollouts per question
  max_gen_round: 8
  max_prompt_length: 8096
  max_new_tokens: 1024
  text_search_limit: 2

early_stop:
  enabled: false

# Library runs (App. "Per-Dataset HyperSkill Configuration"): one epoch over the
# 128 training questions, batch size 4, n = 2.
library_runs:
  R1:
    llm: {temperature: 1.0}
    hypergraph: {train_min_similarity: 0.2, hint_synthesis: false, cf_distinct_failures: false}
    early_stop: {enabled: true}
  R2:
    llm: {temperature: 0.4}
    hypergraph: {train_min_similarity: 0.55, hint_synthesis: true}
  R3:
    llm: {temperature: 0.4}
    hypergraph: {train_min_similarity: 0.2, hint_synthesis: true}

# Evaluation: 1 rollout per question, greedy decoding.
eval:
  llm: {temperature: 0.0}
  hypergraph:
    test_top_k: 3             # N_max
    test_min_similarity: 0.55 # tau
    test_min_advantage: -2.0
    hint_synthesis: true      # P7

datasets:
  OmniVideoBench:
    library_run: R2
  WorldSense:
    library_run: R1
    harness:                         # shared harness settings (training and evaluation)
      rollout: {max_new_tokens: 4096, max_frames: 32}
