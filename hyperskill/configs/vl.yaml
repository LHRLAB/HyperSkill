# HyperSkill — Vision-Language modality config
# Datasets: FVQA, InfoSeek, SimpleVQA, LiveVQA, DocBench, MMLongBench-Doc
# runner._build_cfg() loads these on top of the config.py dataclass defaults;
# in eval mode runner._EVAL_RETRIEVAL then overrides the test_* fields.

llm:
  base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.1-flash-lite-preview
  embedding_model: google/gemini-embedding-2-preview
  embedding_dim: 3072
  max_tokens: 2048
  temperature: 1.0       # bumped from 0.7 — diversify rollouts so GRPO has variance
  max_retries: 3
  timeout: 90.0

hypergraph:
  top_k: 10
  test_min_similarity: 0.2     # training-time retrieval floor (eval overrides to 0.0)
  skill_dedup_threshold: 1.0
  eta: 0.1
  beta: 0.01
  eps: 0.2
  prune_interval: 500
  prune_min_advantage: -0.5

rollout:
  n: 4                   # bumped from 2 — more rollouts → more variance for skill extraction
  max_gen_round: 5
  max_prompt_length: 6144
  max_new_tokens: 1024
  text_search_limit: 2
